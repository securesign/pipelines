apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/securesign/pipelines?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch == "main" && ( "tasks/go-unit-test-oci-ta/***".pathChanged() || ".tekton/task-go-unit-test-oci-ta-pull-request.yaml".pathChanged() || "pipelines/tekton-bundle-builder-oci-ta.yaml".pathChanged() )
    pipelinesascode.tekton.dev/pipeline: pipelines/tekton-bundle-builder-oci-ta.yaml
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: pipelines-tasks
    appstudio.openshift.io/component: task-go-unit-test-oci-ta
    pipelines.appstudio.openshift.io/type: build
  name: task-go-unit-test-oci-ta-on-pull-request
  namespace: rhtas-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: output-image
      value: quay.io/redhat-user-workloads/rhtas-tenant/task-go-unit-test-oci-ta:on-pr-{{revision}}
    - name: image-expires-after
      value: 5d
    - name: path-context
      value: tasks/go-unit-test-oci-ta
    - name: sast-target-dirs
      value: tasks/go-unit-test-oci-ta
  pipelineRef:
    name: tekton-bundle-builder-oci-ta
  taskRunTemplate:
    serviceAccountName: build-pipeline-task-go-unit-test-oci-ta
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
status: {}
