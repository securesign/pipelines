apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: policy-controller-operator-upgrade-
spec:
  description: |
    An integration test which provisions an ephemeral Hypershift cluster, and runs the 
    policy controller operators upgrade scenario.
  workspaces:
    - name: work
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  pipelineSpec:
    params:
      - name: SNAPSHOT
      - name: OCP_VERSION
        default: "4.19"
      - name: COMPUTE_NODE_TYPE
        default: m5.large
        description: Instance type for HyperShift compute nodes.
      - name: HOSTED_MANAGEMENT_CLUSTER
        default: hosted-mgmt2
        description: Hosted management cluster used to provision the ephemeral cluster.
      - name: RHTAS_BUNDLE_IMAGE
        default: registry.redhat.io/rhtas/rhtas-operator-bundle:1.4.3
      - name: TAS_DEPLOY_NAMESPACE
        default: tas
      - name: POLICY_CONTROLLER_OPERATOR_GIT_URL
        default: https://github.com/securesign/policy-controller-operator
      - name: UPGRADE_FROM_CHANNEL
        default: stable
      - name: RHTAS_GIT_URL
        default: https://github.com/securesign/secure-sign-operator
      - name: RHTAS_GIT_REVISION
        default: release-1.4
    workspaces:
      - name: work
    tasks:
      - name: parse-metadata
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/konflux-ci/tekton-integration-catalog
            - name: revision
              value: main
            - name: pathInRepo
              value: tasks/test-metadata/0.4/test-metadata.yaml
        params:
          - name: SNAPSHOT
            value: $(params.SNAPSHOT)
      - name: release-info
        runAfter:
          - parse-metadata
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/securesign/pipelines.git
            - name: revision
              value: tdalton/KFLUXVNGD-1363
            - name: pathInRepo
              value: tasks/integration-test/derive-release-info.yaml
        params:
          - name: package-name
            value: "policy-controller-operator"
          - name: fbc-image
            value: "$(tasks.parse-metadata.results.container-image)"
          - name: ocp-version
            value: $(params.OCP_VERSION)
      - name: clone-tas-operator-source-code
        runAfter:
          - parse-metadata
        taskRef:
          params:
            - name: name
              value: git-clone
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-git-clone:0.2.6
            - name: kind
              value: task
          resolver: bundles
        params:
          - name: url
            value: $(params.RHTAS_GIT_URL)
          - name: revision
            value: $(params.RHTAS_GIT_REVISION)
          - name: subdirectory
            value: "tas-operator"
        workspaces:
          - name: output
            workspace: work
      - name: clone-operator-source-code
        runAfter:
          - release-info
        taskRef:
          params:
            - name: name
              value: git-clone
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-git-clone:0.2.6
            - name: kind
              value: task
          resolver: bundles
        params:
          - name: url
            value: $(params.POLICY_CONTROLLER_OPERATOR_GIT_URL)
          - name: revision
            value: "$(tasks.release-info.results.release-branch)"
          - name: subdirectory
            value: "operator"
        workspaces:
          - name: output
            workspace: work
      - name: prepare-cluster-env
        taskSpec:
          workspaces:
            - name: env-files
          steps:
            - name: write-image-content-sources
              image: registry.redhat.io/ubi9/ubi-minimal:latest
              script: |
                #!/usr/bin/env sh
                mkdir -p "$(workspaces.env-files.path)/cluster-env"
                cat > "$(workspaces.env-files.path)/cluster-env/IMAGE_CONTENT_SOURCES" <<'EOF'
                - source: registry.redhat.io/rhtas/policy-controller-rhel9
                  mirrors:
                    - quay.io/securesign/policy-controller
                - source: registry.redhat.io/rhtas/policy-controller-rhel9-operator
                  mirrors:
                    - quay.io/securesign/policy-controller-operator
                - source: registry.redhat.io/rhtas/policy-controller-operator-bundle
                  mirrors:
                  - quay.io/securesign/policy-controller-operator-bundle
                EOF
        workspaces:
          - name: env-files
            workspace: work
      - name: provision-cluster
        runAfter:
          - prepare-cluster-env
          - parse-metadata
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/openshift/konflux-tasks
            - name: revision
              value: main
            - name: pathInRepo
              value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
        workspaces:
          - name: env-files
            workspace: work
            subPath: cluster-env
        params:
          - name: ownerName
            value: $(context.pipelineRun.name)
          - name: ownerUid
            value: $(context.pipelineRun.uid)
          - name: workflow
            value: hypershift-hostedcluster-workflow
          - name: clusterProfile
            value: aws-konflux-prod
          - name: timeout
            value: 1h
          - name: env
            value: '{"COMPUTE_NODE_TYPE":"$(params.COMPUTE_NODE_TYPE)","HOSTED_MANAGEMENT_CLUSTER":"$(params.HOSTED_MANAGEMENT_CLUSTER)"}'
          - name: releases
            value: >-
              {"latest":{"release":{"channel":"stable","version":"$(params.OCP_VERSION)","architecture":"multi"}}}

      - name: install-rhtas-operator
        runAfter:
          - provision-cluster
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/securesign/pipelines.git
            - name: revision
              value: tdalton/KFLUXVNGD-1363
            - name: pathInRepo
              value: tasks/integration-test/install-operator-from-bundle.yaml
        params:
          - name: clusterCredentialsSecretRef
            value: $(tasks.provision-cluster.results.secretRef)
          - name: bundleImage
            value: "$(params.RHTAS_BUNDLE_IMAGE)"
      - name: download-binaries
        workspaces:
          - name: work
            workspace: work
        taskSpec:
          workspaces:
            - name: work
          steps:
            - name: get-cosign
              image: registry.redhat.io/rhtas/cosign-rhel9:1.3.1
              securityContext:
                runAsUser: 0
              script: |
                mkdir -p $(workspaces.work.path)/binaries
                cp /usr/local/bin/cosign $(workspaces.work.path)/binaries/
      - name: prepare-tests
        runAfter:
          - install-rhtas-operator
          - clone-tas-operator-source-code
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/securesign/pipelines.git
            - name: revision
              value: tdalton/KFLUXVNGD-1363
            - name: pathInRepo
              value: tasks/integration-test/prepare-tests.yaml
        params:
          - name: clusterCredentialsSecretRef
            value: $(tasks.provision-cluster.results.secretRef)
          - name: workdir
            value: "tas-operator"
          - name: install-tas
            value: "true"
          - name: tas-namespace
            value: "$(params.TAS_DEPLOY_NAMESPACE)"
        workspaces:
          - name: source-code
            workspace: work
      - name: run-operator-upgrade
        runAfter:
          - prepare-tests
          - download-binaries
          - clone-operator-source-code
        workspaces:
          - name: source-code
            workspace: work
        params:
          - name: clusterCredentialsSecretRef
            value: $(tasks.provision-cluster.results.secretRef)
        taskSpec:
          params:
            - name: clusterCredentialsSecretRef
              type: string
          results:
            - name: TEST_OUTPUT
              description: "Full JSON summary of test results"
          volumes:
            - name: credentials
              secret:
                secretName: $(params.clusterCredentialsSecretRef)
            - name: quay-creds
              secret:
                secretName: quay-e2e-test-creds
                items:
                  - key: .dockerconfigjson
                    path: config.json
          workspaces:
            - name: source-code
          steps:
            - name: execute-test
              onError: continue
              image: registry.redhat.io/ubi9/go-toolset@sha256:685ccca486cc2c82b0818d835abecb1aed7a396e76ba416cfc47c28067f5d365
              results:
                - name: exit-code
              env:
                - name: OIDC_HOST
                  value: "$(tasks.prepare-tests.results.oidc-hostname)"
                - name: TUF_URL
                  value: "$(tasks.prepare-tests.results.tuf-url)"
                - name: FULCIO_URL
                  value: "$(tasks.prepare-tests.results.fulcio-url)"
                - name: REKOR_URL
                  value: "$(tasks.prepare-tests.results.rekor-url)"
                - name: REKOR_UI_URL
                  value: "$(tasks.prepare-tests.results.rekor-ui-url)"
                - name: TSA_URL
                  value: "$(tasks.prepare-tests.results.tsa-url)/api/v1/timestamp"
                - name: KUBECONFIG
                  value: "/credentials/kubeconfig"
                - name: RHTAS_INSTALL_NAMESPACE
                  value: "$(params.TAS_DEPLOY_NAMESPACE)"
                - name: UPGRADE_FROM_OPERATOR_INDEX_IMAGE
                  value: "registry.redhat.io/redhat/redhat-operator-index:v$(params.OCP_VERSION)"
                - name: UPGRADE_TO_OPERATOR_INDEX_IMAGE
                  value: "$(tasks.parse-metadata.results.container-image)"
                - name: UPGRADE_FROM_CHANNEL
                  value: "$(params.UPGRADE_FROM_CHANNEL)"
                - name: UPGRADE_TO_CHANNEL
                  value: "$(tasks.release-info.results.channel)"
                - name: DOCKER_CONFIG
                  value: /quay-auth
              computeResources:
                requests:
                  cpu: "1"
                  memory: "4Gi"
                limits:
                  cpu: "2"
                  memory: "8Gi"
              volumeMounts:
                - name: credentials
                  mountPath: /credentials
                - name: quay-creds
                  mountPath: /quay-auth
              workingDir: $(workspaces.source-code.path)/operator
              script: |
                #!/bin/sh
                set +e -o pipefail
                export PATH="$PATH:$(workspaces.source-code.path)/binaries"
                openssl s_client -connect "$OIDC_HOST:443" -showcerts </dev/null > /tmp/ssl.cert
                sed -ni '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' /tmp/ssl.cert
                cat /tmp/ssl.cert >> /etc/pki/tls/certs/ca-bundle.crt
                export SSL_CERT_FILE=/tmp/ssl.cert
                export INJECT_CA=true
                export OIDC_ISSUER_URL=https://$OIDC_HOST/realms/trusted-artifact-signer

                source ./test/tas-env-variables.sh
                go mod vendor
                mkdir -p $(workspaces.source-code.path)/dump/operator-upgrade
                go test -p 1 -count=1 -tags=upgrade -v -timeout 30m -json ./test/... > $(workspaces.source-code.path)/dump/operator-upgrade/test-result.json
                status=$?
                printf "%s" "$status" > "$(step.results.exit-code.path)"
                cp test/**/k8s-dump-*.tar.gz $(workspaces.source-code.path)/dump/operator-upgrade/ || echo "no test dump files found"

              securityContext:
                runAsUser: 0
            - name: process-test-results
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/securesign/pipelines.git
                  - name: revision
                    value: tdalton/KFLUXVNGD-1363
                  - name: pathInRepo
                    value: stepactions/integration-test/process-go-test-results.yaml
              params:
                - name: test_output_file
                  value: $(workspaces.source-code.path)/dump/operator-upgrade/test-result.json
                - name: test_status
                  value: $(steps.execute-test.results.exit-code)
