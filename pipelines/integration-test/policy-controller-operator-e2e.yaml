apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: policy-controller-operator-e2e-
spec:
  description: |
    An integration test which provisions an ephemeral Hypershift cluster, deploys the policy controller operator
    from a Konflux snapshot and run the e2e test suite.
  workspaces:
    - name: work
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  pipelineSpec:
    params:
      - name: SNAPSHOT
      - name: OCP_VERSION
        default: "4.19"
      - name: COMPUTE_NODE_TYPE
        default: m5.large
        description: Instance type for HyperShift compute nodes.
      - name: HOSTED_MANAGEMENT_CLUSTER
        default: hosted-mgmt2
        description: Hosted management cluster used to provision the ephemeral cluster.
      - name: RHTAS_BUNDLE_IMAGE
        default: registry.redhat.io/rhtas/rhtas-operator-bundle:1.4.3
      - name: TAS_DEPLOY_NAMESPACE
        default: tas
      - name: POLICY_CONTROLLER_OPERATOR_NS
        default: policy-controller-operator
      - name: RHTAS_GIT_URL
        default: https://github.com/securesign/secure-sign-operator
      - name: RHTAS_GIT_REVISION
        default: release-1.4
      - name: FIPS_ENABLED
        default: "false"
      - name: CLUSTER_PLATFORM
        description: "Target environment for Keycloak installation: openshift or kind"
        default: "openshift"
    workspaces:
      - name: work
    tasks:
      - name: parse-metadata
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/securesign/pipelines.git
            - name: revision
              value: tdalton/KFLUXVNGD-1363
            - name: pathInRepo
              value: tasks/integration-test/parse-metadata.yaml
        params:
          - name: SNAPSHOT
            value: $(params.SNAPSHOT)
          - name: DEFAULT_COMPONENT_NAME
            value: policy-controller-operator-bundle
      - name: clone-tas-operator-source-code
        runAfter:
          - parse-metadata
        taskRef:
          params:
            - name: name
              value: git-clone
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-git-clone:0.2.6
            - name: kind
              value: task
          resolver: bundles
        params:
          - name: url
            value: $(params.RHTAS_GIT_URL)
          - name: revision
            value: $(params.RHTAS_GIT_REVISION)
          - name: subdirectory
            value: "tas-operator"
        workspaces:
          - name: output
            workspace: work
      - name: clone-operator-source-code
        runAfter:
          - parse-metadata
        taskRef:
          params:
            - name: name
              value: git-clone
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-git-clone:0.2.6
            - name: kind
              value: task
          resolver: bundles
        params:
          - name: url
            value: $(tasks.parse-metadata.results.git-url)
          - name: revision
            value: $(tasks.parse-metadata.results.git-revision)
          - name: subdirectory
            value: "operator"
        workspaces:
          - name: output
            workspace: work
      - name: prepare-cluster-env
        taskSpec:
          workspaces:
            - name: env-files
          steps:
            - name: write-image-content-sources
              image: registry.redhat.io/ubi9/ubi-minimal:latest
              script: |
                #!/usr/bin/env sh
                mkdir -p "$(workspaces.env-files.path)/cluster-env"
                cat > "$(workspaces.env-files.path)/cluster-env/IMAGE_CONTENT_SOURCES" <<'EOF'
                - source: registry.redhat.io/rhtas/policy-controller-rhel9
                  mirrors:
                    - quay.io/securesign/policy-controller
                - source: registry.redhat.io/rhtas/policy-controller-rhel9-operator
                  mirrors:
                    - quay.io/securesign/policy-controller-operator
                - source: registry.redhat.io/rhtas/policy-controller-operator-bundle
                  mirrors:
                  - quay.io/securesign/policy-controller-operator-bundle
                EOF
        workspaces:
          - name: env-files
            workspace: work
      - name: provision-cluster
        runAfter:
          - prepare-cluster-env
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/openshift/konflux-tasks
            - name: revision
              value: main
            - name: pathInRepo
              value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
        workspaces:
          - name: env-files
            workspace: work
            subPath: cluster-env
        params:
          - name: ownerName
            value: $(context.pipelineRun.name)
          - name: ownerUid
            value: $(context.pipelineRun.uid)
          - name: workflow
            value: hypershift-hostedcluster-workflow
          - name: clusterProfile
            value: aws-konflux-prod
          - name: timeout
            value: 1h
          - name: env
            value: '{"COMPUTE_NODE_TYPE":"$(params.COMPUTE_NODE_TYPE)","FIPS":"$(params.FIPS_ENABLED)","HOSTED_MANAGEMENT_CLUSTER":"$(params.HOSTED_MANAGEMENT_CLUSTER)"}'
          - name: releases
            value: >-
              {"latest":{"release":{"channel":"stable","version":"$(params.OCP_VERSION)","architecture":"multi"}}}

      - name: install-rhtas-operator
        runAfter:
          - provision-cluster
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/securesign/pipelines.git
            - name: revision
              value: tdalton/KFLUXVNGD-1363
            - name: pathInRepo
              value: tasks/integration-test/install-operator-from-bundle.yaml
        params:
          - name: clusterCredentialsSecretRef
            value: $(tasks.provision-cluster.results.secretRef)
          - name: bundleImage
            value: "$(params.RHTAS_BUNDLE_IMAGE)"
      - name: prepare-tests
        runAfter:
          - install-rhtas-operator
          - clone-tas-operator-source-code
          - install-operator-from-bundle
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/securesign/pipelines.git
            - name: revision
              value: tdalton/KFLUXVNGD-1363
            - name: pathInRepo
              value: tasks/integration-test/prepare-tests.yaml
        params:
          - name: clusterCredentialsSecretRef
            value: $(tasks.provision-cluster.results.secretRef)
          - name: workdir
            value: "tas-operator"
          - name: install-tas
            value: "true"
          - name: cluster-platform
            value: "$(params.CLUSTER_PLATFORM)"
          - name: tas-namespace
            value: "$(params.TAS_DEPLOY_NAMESPACE)"
        workspaces:
          - name: source-code
            workspace: work
      - name: install-operator-from-bundle
        runAfter:
          - provision-cluster
          - parse-metadata
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/securesign/pipelines.git
            - name: revision
              value: tdalton/KFLUXVNGD-1363
            - name: pathInRepo
              value: tasks/integration-test/install-operator-from-bundle.yaml
        params:
          - name: clusterCredentialsSecretRef
            value: $(tasks.provision-cluster.results.secretRef)
          - name: bundleImage
            value: "$(tasks.parse-metadata.results.container-image)"
      - name: download-binaries
        workspaces:
          - name: work
            workspace: work
        taskSpec:
          workspaces:
            - name: work
          steps:
            - name: get-cosign
              image: registry.redhat.io/rhtas/cosign-rhel9:1.3.1
              securityContext:
                runAsUser: 0
              script: |
                mkdir -p $(workspaces.work.path)/binaries
                cp /usr/local/bin/cosign $(workspaces.work.path)/binaries/
      - name: run-operator-e2e
        runAfter:
          - prepare-tests
          - download-binaries
          - clone-operator-source-code
          - install-operator-from-bundle
        workspaces:
          - name: source-code
            workspace: work
        params:
          - name: clusterCredentialsSecretRef
            value: $(tasks.provision-cluster.results.secretRef)
        taskSpec:
          params:
            - name: clusterCredentialsSecretRef
              type: string
          volumes:
            - name: credentials
              secret:
                secretName: $(params.clusterCredentialsSecretRef)
            - name: quay-creds
              secret:
                secretName: quay-e2e-test-creds
                items:
                  - key: .dockerconfigjson
                    path: config.json
          workspaces:
            - name: source-code
          steps:
            - name: execute-operator-e2e
              image: registry.redhat.io/ubi9/go-toolset@sha256:685ccca486cc2c82b0818d835abecb1aed7a396e76ba416cfc47c28067f5d365
              env:
                - name: OIDC_HOST
                  value: "$(tasks.prepare-tests.results.oidc-hostname)"
                - name: TUF_URL
                  value: "$(tasks.prepare-tests.results.tuf-url)"
                - name: FULCIO_URL
                  value: "$(tasks.prepare-tests.results.fulcio-url)"
                - name: REKOR_URL
                  value: "$(tasks.prepare-tests.results.rekor-url)"
                - name: REKOR_UI_URL
                  value: "$(tasks.prepare-tests.results.rekor-ui-url)"
                - name: TSA_URL
                  value: "$(tasks.prepare-tests.results.tsa-url)/api/v1/timestamp"
                - name: KUBECONFIG
                  value: "/credentials/kubeconfig"
                - name: RHTAS_INSTALL_NAMESPACE
                  value: "$(params.TAS_DEPLOY_NAMESPACE)"
                - name: POLICY_CONTROLLER_OPERATOR_NS
                  value: "$(params.POLICY_CONTROLLER_OPERATOR_NS)"
                - name: FIPS_ENABLED
                  value: "$(params.FIPS_ENABLED)"
                - name: DOCKER_CONFIG
                  value: /quay-auth
              computeResources:
                requests:
                  cpu: "1500m"
                  memory: "3Gi"
                limits:
                  cpu: "3"
                  memory: "6Gi"
              volumeMounts:
                - name: credentials
                  mountPath: /credentials
                - name: quay-creds
                  mountPath: /quay-auth
              workingDir: $(workspaces.source-code.path)/operator
              script: |
                #!/bin/sh
                set +e -o pipefail
                export PATH="$PATH:$(workspaces.source-code.path)/binaries"
                openssl s_client -connect "$OIDC_HOST:443" -showcerts </dev/null > /tmp/ssl.cert
                sed -ni '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' /tmp/ssl.cert
                cat /tmp/ssl.cert >> /etc/pki/tls/certs/ca-bundle.crt
                export SSL_CERT_FILE=/tmp/ssl.cert
                export INJECT_CA=true
                export OIDC_ISSUER_URL=https://$OIDC_HOST/realms/trusted-artifact-signer
                
                source ./test/tas-env-variables.sh
                go mod vendor

                TAGS="integration"
                if [[ "$FIPS_ENABLED" == "true" ]]; then
                  TAGS="fips,integration"
                fi

                go test ./test/e2e/... -tags="$TAGS" -timeout 60m
                status=$?
                
                if [[ $status -ne 0 ]]; then
                  pods=$(oc get pods -n "$POLICY_CONTROLLER_OPERATOR_NS" -o jsonpath='{.items[*].metadata.name}')
                  for pod in $pods; do
                    echo "===== logs for $pod ====="
                    oc logs -n "$POLICY_CONTROLLER_OPERATOR_NS" --all-containers --prefix true "$pod" || true
                  done
                fi
                
                exit "$status"
