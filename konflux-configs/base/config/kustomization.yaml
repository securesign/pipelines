apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: namespace-wide-nudging-renovate-config
    literals:
      - automerge="true"
      - platformAutomerge="true"

  # Merge stream-specific release and image mappings into one ConfigMap.
  - name: rhtas-repo-branch-versions
    envs:
      - rhtas-versions.main.properties
      - rhtas-versions.1.4.properties
      - rhtas-versions.1.5.properties
