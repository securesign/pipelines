apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: run-operator-e2e
spec:
  description: "Runs E2E integration tests for the operator and processes results."
  params:
    - name: clusterCredentialsSecretRef
      type: string
      description: Name of the secret containing the cluster admin kubeconfig.
    - name: oidcHostname
      type: string
      description: "The hostname for the OIDC provider"
    - name: oidc-issuer-url
      type: string
      description: "Trusted artifact signer issuer url"
    - name: fips-enabled
  workspaces:
    - name: source-code
      description: "The workspace containing the operator source code"
  results:
    - name: TEST_OUTPUT
      description: "Full JSON summary of test results"
  volumes:
    - name: credentials
      secret:
        secretName: $(params.clusterCredentialsSecretRef)
    - name: quay-creds
      secret:
        secretName: quay-e2e-test-creds
        items:
          - key: .dockerconfigjson
            path: config.json
  steps:
    - name: execute-operator-e2e
      onError: continue
      image: registry.redhat.io/ubi9/go-toolset@sha256:685ccca486cc2c82b0818d835abecb1aed7a396e76ba416cfc47c28067f5d365
      results:
        - name: exit-code
      env:
        - name: OIDC_HOST
          value: "$(params.oidcHostname)"
        - name: OIDC_ISSUER_URL
          value: "$(params.oidc-issuer-url)"
        - name: KUBECONFIG
          value: "/credentials/kubeconfig"
        - name: CI
          value: "true"
        - name: FIPS_ENABLED
          value: "$(params.fips-enabled)"
        - name: DOCKER_CONFIG
          value: /quay-auth
      volumeMounts:
        - name: credentials
          mountPath: /credentials
        - name: quay-creds
          mountPath: /quay-auth
      workingDir: $(workspaces.source-code.path)/operator
      resources:
        requests:
          memory: "4Gi"
          cpu: "1"
        limits:
          memory: "8Gi"
          cpu: "2"
      script: |
        #!/bin/sh
        set +e -o pipefail

        mkdir -p $(workspaces.source-code.path)/dump/operator-e2e/
        
        export PATH="$PATH:$(workspaces.source-code.path)/binaries"
        export OIDC_ISSUER_URL=https://$OIDC_HOST/realms/trusted-artifact-signer
        
        # Ensure SSL trust for the OIDC host
        openssl s_client -connect $OIDC_HOST:443 </dev/null | sed -ne '/-BEGIN CERTIFICATE-/,/-END CERTIFICATE-/p' > /tmp/ssl.cert
        export SSL_CERT_FILE=/tmp/ssl.cert
        
        go mod vendor
        make generate
        
        TAGS="integration"
        if [[ "$FIPS_ENABLED" == "true" ]]; then
          TAGS="fips,integration"
        fi


        go test ./test/e2e/... -tags="$TAGS" -timeout 60m -json > $(workspaces.source-code.path)/dump/operator-e2e/test-result.json
        status=$?
        printf "%s" "$status" > "$(step.results.exit-code.path)"

        cp test/**/k8s-dump-*.tar.gz $(workspaces.source-code.path)/dump/operator-e2e/ || echo "no test dump files found"
      securityContext:
        runAsUser: 0
    - name: process-test-results
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/securesign/pipelines.git
          - name: revision
            value: tdalton/KFLUXVNGD-1363
          - name: pathInRepo
            value: stepactions/integration-test/process-go-test-results.yaml
      params:
        - name: test_output_file
          value: $(workspaces.source-code.path)/dump/operator-e2e/test-result.json
        - name: test_status
          value: $(steps.execute-operator-e2e.results.exit-code)
