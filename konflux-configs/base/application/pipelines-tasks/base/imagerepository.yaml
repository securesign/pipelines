
apiVersion: appstudio.redhat.com/v1alpha1
kind: ImageRepository 
metadata:
  annotations:
    image-controller.appstudio.redhat.com/update-component-image: 'true'
  name: konflux-task-get-version-from-configmap
  labels:
    appstudio.redhat.com/application: pipelines-tasks
    appstudio.redhat.com/component: task-get-version-from-configmap
spec:
  image:
    name: rhtas-tenant/task-get-version-from-configmap
    visibility: public 
  notifications:
    - config:
        url: https://bombino.api.redhat.com/v1/sbom/quay/push
      event: repo_push
      method: webhook
      title: SBOM-event-to-Bombino

