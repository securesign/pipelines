apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: get-version-from-configmap
spec:
  description: >
    Looks up release and image versions by repository, target branch, and
    optional component. An image version defaults to the resolved release version.
  params:
    - name: git-url
      description: Source repository URL
      type: string
    - name: target-branch
      description: Target branch for the version lookup; an empty value uses the PipelineRun annotation
      type: string
      default: ""
    - name: component-name
      description: Stable component identifier; an empty value uses the output image name
      type: string
      default: ""
    - name: output-image
      description: Output image used to derive the component name when none is supplied
      type: string
      default: ""
    - name: configmap-name
      description: ConfigMap containing the version mappings
      type: string
      default: rhtas-repo-branch-versions
    - name: default-version
      description: Version to use when no mapping exists
      type: string
      default: "0.0.0-dev"
    - name: default-image-version
      description: Existing per-component image version used when no ConfigMap image mapping exists
      type: string
      default: ""
    - name: allow-missing-configmap
      description: Use the default version when the ConfigMap has not been deployed yet
      type: string
      default: "false"
  results:
    - name: release-version
      description: Resolved release version
    - name: image-version
      description: Resolved image metadata version
    - name: lookup-key
      description: ConfigMap key that provided the release version
    - name: image-lookup-key
      description: ConfigMap key or fallback that provided the image version
  volumes:
    - name: version-config
      configMap:
        name: $(params.configmap-name)
        optional: true
  steps:
    - name: get-version
      image: quay.io/konflux-ci/konflux-test:1.4.41@sha256:afea44d83043be7f528ec2cacaeb0c3b69cdafdd86a1b930957def38400f8a6c
      volumeMounts:
        - name: version-config
          mountPath: /etc/rhtas-versions
          readOnly: true
      env:
        - name: TASKRUN_NAME
          value: $(context.taskRun.name)
        - name: TASKRUN_NAMESPACE
          value: $(context.taskRun.namespace)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        GIT_URL="$(params.git-url)"
        CM_NAME="$(params.configmap-name)"
        CM_NAMESPACE="${TASKRUN_NAMESPACE}"
        CM_DIR=/etc/rhtas-versions
        DEFAULT_VERSION="$(params.default-version)"
        DEFAULT_IMAGE_VERSION="$(params.default-image-version)"
        ALLOW_MISSING_CONFIGMAP="$(params.allow-missing-configmap)"
        BRANCH="$(params.target-branch)"
        COMPONENT_NAME="$(params.component-name)"
        OUTPUT_IMAGE="$(params.output-image)"

        # Pipelines-as-Code sets the target branch on the PipelineRun. Keep the
        # lookup usable for callers that do not pass target-branch explicitly.
        if [[ -z "${BRANCH}" ]]; then
          PIPELINERUN_NAME=$(oc get taskrun "${TASKRUN_NAME}" -n "${TASKRUN_NAMESPACE}" \
            -o jsonpath='{.metadata.ownerReferences[?(@.kind=="PipelineRun")].name}')
          if [[ -z "${PIPELINERUN_NAME}" ]]; then
            echo "Could not determine the PipelineRun owning TaskRun ${TASKRUN_NAME}" >&2
            exit 1
          fi

          BRANCH=$(oc get pipelinerun "${PIPELINERUN_NAME}" -n "${TASKRUN_NAMESPACE}" \
            -o jsonpath='{.metadata.annotations.build\.appstudio\.redhat\.com/target_branch}')
        fi
        if [[ -z "${BRANCH}" ]]; then
          echo "Target branch is required for release-version lookup" >&2
          exit 1
        fi

        REPO_NAME=$(basename "${GIT_URL%.git}")
        if [[ -z "${COMPONENT_NAME}" && -n "${OUTPUT_IMAGE}" ]]; then
          COMPONENT_NAME="${OUTPUT_IMAGE##*/}"
          COMPONENT_NAME="${COMPONENT_NAME%%@*}"
          COMPONENT_NAME="${COMPONENT_NAME%%:*}"
        fi
        echo "Repository: ${REPO_NAME}"
        echo "Branch: ${BRANCH}"
        echo "Component: ${COMPONENT_NAME:-<none>}"
        echo "ConfigMap: ${CM_NAMESPACE}/${CM_NAME}"

        write_results() {
          printf '%s' "${VERSION}" > "$(results.release-version.path)"
          printf '%s' "${IMAGE_VERSION}" > "$(results.image-version.path)"
          printf '%s' "${LOOKUP_KEY}" > "$(results.lookup-key.path)"
          printf '%s' "${IMAGE_LOOKUP_KEY}" > "$(results.image-lookup-key.path)"
        }

        if [[ -z "$(find "${CM_DIR}" -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
          if [[ "${ALLOW_MISSING_CONFIGMAP}" != "true" ]]; then
            echo "ConfigMap ${CM_NAMESPACE}/${CM_NAME} does not exist" >&2
            exit 1
          fi
          echo "ConfigMap ${CM_NAMESPACE}/${CM_NAME} is not deployed; using default version ${DEFAULT_VERSION}" >&2
          VERSION="${DEFAULT_VERSION}"
          LOOKUP_KEY=default
          IMAGE_VERSION="${DEFAULT_IMAGE_VERSION:-${VERSION}}"
          IMAGE_LOOKUP_KEY=release-version
          if [[ -n "${DEFAULT_IMAGE_VERSION}" ]]; then
            IMAGE_LOOKUP_KEY=pipeline-image-version
          fi
          write_results
          exit 0
        fi

        get_configmap_value() {
          local key="$1"
          [[ "${key}" =~ ^[A-Za-z0-9._-]+$ ]] || return 0
          if [[ -f "${CM_DIR}/${key}" ]]; then
            cat "${CM_DIR}/${key}"
          fi
        }

        VERSION=""
        if [[ -n "${COMPONENT_NAME}" ]]; then
          LOOKUP_KEY="${REPO_NAME}__${BRANCH}__${COMPONENT_NAME}__release"
          VERSION=$(get_configmap_value "${LOOKUP_KEY}")
        fi
        if [[ -z "${VERSION}" ]]; then
          LOOKUP_KEY="${REPO_NAME}__${BRANCH}"
          VERSION=$(get_configmap_value "${LOOKUP_KEY}")
        fi
        if [[ -z "${VERSION}" && -n "${COMPONENT_NAME}" ]]; then
          LOOKUP_KEY="${REPO_NAME}__${COMPONENT_NAME}__release"
          VERSION=$(get_configmap_value "${LOOKUP_KEY}")
        fi
        if [[ -z "${VERSION}" ]]; then
          LOOKUP_KEY="${REPO_NAME}"
          VERSION=$(get_configmap_value "${LOOKUP_KEY}")
        fi
        if [[ -z "${VERSION}" ]]; then
          LOOKUP_KEY=default
          VERSION="${DEFAULT_VERSION}"
        fi
        echo "Release version: ${LOOKUP_KEY} = ${VERSION}"

        IMAGE_VERSION=""
        if [[ -n "${COMPONENT_NAME}" ]]; then
          IMAGE_LOOKUP_KEY="${REPO_NAME}__${BRANCH}__${COMPONENT_NAME}__image"
          IMAGE_VERSION=$(get_configmap_value "${IMAGE_LOOKUP_KEY}")
        fi
        if [[ -z "${IMAGE_VERSION}" ]]; then
          IMAGE_LOOKUP_KEY="${REPO_NAME}__${BRANCH}__image"
          IMAGE_VERSION=$(get_configmap_value "${IMAGE_LOOKUP_KEY}")
        fi
        if [[ -z "${IMAGE_VERSION}" && -n "${COMPONENT_NAME}" ]]; then
          IMAGE_LOOKUP_KEY="${REPO_NAME}__${COMPONENT_NAME}__image"
          IMAGE_VERSION=$(get_configmap_value "${IMAGE_LOOKUP_KEY}")
        fi
        if [[ -z "${IMAGE_VERSION}" ]]; then
          IMAGE_LOOKUP_KEY="${REPO_NAME}__image"
          IMAGE_VERSION=$(get_configmap_value "${IMAGE_LOOKUP_KEY}")
        fi
        if [[ -z "${IMAGE_VERSION}" ]]; then
          IMAGE_LOOKUP_KEY=pipeline-image-version
          IMAGE_VERSION="${DEFAULT_IMAGE_VERSION}"
        fi
        if [[ -z "${IMAGE_VERSION}" ]]; then
          IMAGE_LOOKUP_KEY=release-version
          IMAGE_VERSION="${VERSION}"
        fi
        echo "Image version: ${IMAGE_LOOKUP_KEY} = ${IMAGE_VERSION}"
        write_results
