apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: validate-fbc-graph-sync
spec:
  description: >-
    Verifies the committed FBC catalog is valid and stays in sync with the
    graph template before the image build starts.
  params:
    - name: path-context
      type: string
      description: Path to the FBC content in the source tree.
    - name: ocp-release-version
      type: string
      description: Target OCP version used to select compatible render options.
  stepTemplate:
    securityContext:
      # This Task mixes images that may use different user IDs across steps.
      runAsUser: 0
  workspaces:
    - name: source
      description: Checked-out source tree to validate.
  steps:
    - name: validate-sync
      image: registry.redhat.io/openshift4/ose-operator-registry-rhel9:v4.21
      workingDir: $(workspaces.source.path)
      env:
        - name: PATH_CONTEXT
          value: $(params.path-context)
        - name: OCP_VERSION
          value: $(params.ocp-release-version)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        graph_file="${PATH_CONTEXT}/graph.yaml"

        if [[ ! -f "${graph_file}" ]]; then
          echo "Required graph file ${graph_file} does not exist."
          exit 1
        fi

        package="$(
          awk '
            $1 == "name:" {
              value = $2
              gsub(/["'\''"]/, "", value)
              last_name = value
            }
            $1 == "schema:" && $2 == "olm.package" {
              print last_name
              exit
            }
            $1 == "package:" {
              value = $2
              gsub(/["'\''"]/, "", value)
              print value
              exit
            }
          ' "${graph_file}"
        )"

        if [[ -z "${package}" ]]; then
          echo "Failed to resolve package name from ${graph_file}."
          exit 1
        fi

        catalog_dir="${PATH_CONTEXT}/catalog/${package}"
        catalog_file="${catalog_dir}/catalog.json"

        if [[ ! -d "${catalog_dir}" ]]; then
          echo "Resolved package ${package}, but catalog directory ${catalog_dir} does not exist."
          exit 1
        fi

        if [[ ! -f "${catalog_file}" ]]; then
          echo "Resolved package ${package}, but catalog file ${catalog_file} does not exist."
          exit 1
        fi

        echo "Validating ${PATH_CONTEXT} for package ${package}"

        echo "Running opm validate on committed catalog..."
        opm validate "${catalog_dir}"

        echo "Checking catalog.json is in sync with graph.yaml..."
        ver="${OCP_VERSION#v}"
        major="${ver%%.*}"
        minor="${ver#*.}"
        minor="${minor%%.*}"
        migrate_flag=()
        if (( major > 4 || (major == 4 && minor >= 17) )); then
          migrate_flag=(--migrate-level=bundle-object-to-csv-metadata)
        fi

        rendered="$(mktemp)"
        committed_norm="$(mktemp)"
        rendered_norm="$(mktemp)"
        trap 'rm -f "${rendered}" "${committed_norm}" "${rendered_norm}"' EXIT

        opm alpha render-template "${migrate_flag[@]}" basic "${graph_file}" > "${rendered}"

        jq -S 'del(.relatedImages)' "${catalog_file}" > "${committed_norm}"
        jq -S 'del(.relatedImages)' "${rendered}" > "${rendered_norm}"

        if ! diff -q "${committed_norm}" "${rendered_norm}" >/dev/null 2>&1; then
          echo "catalog.json is out of sync with graph.yaml"
          diff -u "${committed_norm}" "${rendered_norm}" | head -50
          exit 1
        fi

        echo "Committed catalog is valid and in sync."
