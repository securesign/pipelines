apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: run-tas-pkcs11-e2e
spec:
  description: "Sets up PKCS#11/HSM prerequisites, deploys TAS in PKCS#11 mode, pushes a test image, and executes Sigstore E2E tests."
  params:
    - name: eaasSpaceSecretRef
      type: string
      description: "Secret reference for EaaS space"
    - name: clusterName
      type: string
      description: "Name of the ephemeral cluster"
    - name: oidcHostname
      type: string
      description: "The hostname for the OIDC provider"
    - name: oidc-issuer-url
      type: string
      description: "Trusted artifact signer issuer url"
    - name: TAS_DEPLOY_NAMESPACE
      type: string
      default: "sigstore-pkcs11-test"
      description: "Namespace where TAS is deployed in PKCS#11 mode"
  workspaces:
    - name: source-code
      description: "Workspace containing operator and sigstore-e2e code"
  results:
    - name: TEST_OUTPUT
      description: "Full JSON summary of test results"
  volumes:
    - name: credentials
      emptyDir: {}
    - name: quay-creds
      secret:
        secretName: quay-e2e-test-creds
        items:
          - key: .dockerconfigjson
            path: config.json
  steps:
    - name: get-kubeconfig
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/build-definitions.git
          - name: revision
            value: main
          - name: pathInRepo
            value: stepactions/eaas-get-ephemeral-cluster-credentials/0.1/eaas-get-ephemeral-cluster-credentials.yaml
      params:
        - name: eaasSpaceSecretRef
          value: $(params.eaasSpaceSecretRef)
        - name: clusterName
          value: "$(params.clusterName)"
        - name: credentials
          value: credentials

    - name: install-pkcs11-prerequisites
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/securesign/pipelines.git
          - name: revision
            value: main
          - name: pathInRepo
            value: stepactions/integration-test/install-pkcs11-prerequisites.yaml
      params:
        - name: credentials
          value: credentials
        - name: KUBECONFIG
          value: "$(steps.get-kubeconfig.results.kubeconfig)"
        - name: tas-namespace
          value: "$(params.TAS_DEPLOY_NAMESPACE)"

    - name: install-tas-pkcs11
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/securesign/pipelines.git
          - name: revision
            value: main
          - name: pathInRepo
            value: stepactions/integration-test/install-tas-pkcs11.yaml
      params:
        - name: credentials
          value: credentials
        - name: KUBECONFIG
          value: "$(steps.get-kubeconfig.results.kubeconfig)"
        - name: tas-namespace
          value: "$(params.TAS_DEPLOY_NAMESPACE)"
        - name: OIDC_ISSUER_URL
          value: "$(params.oidc-issuer-url)"

    - name: push-test-image
      image: quay.io/konflux-ci/buildah-task:latest@sha256:4c470b5a153c4acd14bf4f8731b5e36c61d7faafe09c2bf376bb81ce84aa5709
      results:
        - name: image
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      volumeMounts:
        - name: quay-creds
          mountPath: /quay-auth
      script: |
        #!/bin/sh
        set -e
        IMAGE=quay.io/securesign/e2e-tests:pkcs11-$(date +%Y%m%d%H%M%S%N)
        printf "%s" "$IMAGE" > "$(step.results.image.path)"
        CONTAINER=$(buildah --storage-driver=vfs from alpine:latest)
        buildah --storage-driver=vfs run "$CONTAINER" sh -c "echo $(date +%s%N) > /unique-marker"
        buildah --storage-driver=vfs config --label quay.expires-after=1h "$CONTAINER"
        buildah --storage-driver=vfs commit "$CONTAINER" $IMAGE
        buildah --storage-driver=vfs push --authfile /quay-auth/config.json $IMAGE
    - name: prepare-tas-e2e
      image: registry.redhat.io/openshift4/ose-cli
      volumeMounts:
        - name: credentials
          mountPath: /credentials
      env:
        - name: KUBECONFIG
          value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
        - name: TASNAMESPACE
          value: "$(params.TAS_DEPLOY_NAMESPACE)"
        - name: OIDC_ISSUER_URL
          value: "$(params.oidc-issuer-url)"
      script: |
        set -e
        # Copy sigstore-e2e to a separate directory to avoid conflicts with parallel file-mode test
        if [ ! -d "$(workspaces.source-code.path)/sigstore-e2e-pkcs11" ]; then
          cp -a "$(workspaces.source-code.path)/sigstore-e2e" "$(workspaces.source-code.path)/sigstore-e2e-pkcs11"
        fi
        cd "$(workspaces.source-code.path)/sigstore-e2e-pkcs11"
        echo "--- PKCS#11 Stack Status ---"
        echo "=== SecureSign ==="
        oc get securesign -n "$TASNAMESPACE" -o jsonpath='{range .items[0].status.conditions[*]}{.type}{"\t"}{.status}{"\t"}{.reason}{"\t"}{.message}{"\n"}{end}' 2>/dev/null || echo "not found"
        echo "=== Pods ==="
        oc get pods -n "$TASNAMESPACE" -o wide || true
        echo "=== Fulcio ==="
        oc get fulcio -n "$TASNAMESPACE" -o jsonpath='{range .items[0].status.conditions[*]}{.type}{"\t"}{.status}{"\t"}{.reason}{"\t"}{.message}{"\n"}{end}' 2>/dev/null || echo "not found"
        echo "=== CTLog ==="
        oc get ctlog -n "$TASNAMESPACE" -o jsonpath='{range .items[0].status.conditions[*]}{.type}{"\t"}{.status}{"\t"}{.reason}{"\t"}{.message}{"\n"}{end}' 2>/dev/null || echo "not found"
        echo "---"
        oc project $TASNAMESPACE
        ./tas-env-variables.sh > .env
        echo "--- Generated .env ---"
        cat .env
    - name: execute-tas-e2e
      image: registry.redhat.io/ubi9/go-toolset@sha256:444e81b3e88d8a68b92a081a7b3abc7d3fed2450f8473ea6b3caebf3bb73a0b8
      results:
        - name: exit-code
      volumeMounts:
        - name: credentials
          mountPath: /credentials
        - name: quay-creds
          mountPath: /quay-auth
      onError: continue
      env:
        - name: DOCKER_CONFIG
          value: "/quay-auth"
        - name: OIDC_HOST
          value: "$(params.oidcHostname)"
        - name: KUBECONFIG
          value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
        - name: CLI_STRATEGY
          value: "openshift"
        - name: TARGET_IMAGE_NAME
          value: "$(steps.push-test-image.results.image)"
        - name: MANUAL_IMAGE_SETUP
          value: "true"
      resources:
        requests:
          memory: "4Gi"
          cpu: "1"
        limits:
          memory: "8Gi"
          cpu: "2"
      script: |
        #!/bin/bash
        set -x
        cd "$(workspaces.source-code.path)/sigstore-e2e-pkcs11"
        echo "Add certificate to ca-bundle.crt"
        openssl s_client -connect "$OIDC_HOST:443" -showcerts </dev/null > /tmp/ssl.cert
        sed -ni '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' /tmp/ssl.cert
        cat /tmp/ssl.cert >> /etc/pki/tls/certs/ca-bundle.crt

        echo "Run PKCS#11 E2E tests"
        mkdir -p $(workspaces.source-code.path)/dump/sigstore-e2e-pkcs11
        set -o allexport && source ./.env && set +o allexport

        dnf install -y --setopt=install_weak_deps=False \
          alsa-lib atk at-spi2-atk at-spi2-core cairo cups-libs \
          dbus-libs glib2 gtk3 libdrm libglvnd-egl libX11 libX11-xcb \
          libxcb libXcomposite libXdamage libXext libXfixes libxkbcommon \
          libXrandr libxshmfence mesa-libgbm nss nspr pango

        go run github.com/playwright-community/playwright-go/cmd/playwright install chromium
        go mod vendor

        export TEST_FIREFOX=false
        export TEST_SAFARI=false
        export TEST_EDGE=false

        EXCLUDE="benchmark"
        if [ -z "$SIGSTORE_REKOR_UI_URL" ]; then
          echo "SIGSTORE_REKOR_UI_URL is not set, skipping rekorsearchui tests"
          EXCLUDE="benchmark|rekorsearchui"
        fi

        go test -v $(go list ./test/... | grep -vE "$EXCLUDE") --ginkgo.v -json \
        > $(workspaces.source-code.path)/dump/sigstore-e2e-pkcs11/test-result.json
        status=$?
        printf "%s" "$status" > "$(step.results.exit-code.path)"
      securityContext:
        runAsUser: 0
    - name: process-test-results
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/securesign/pipelines.git
          - name: revision
            value: main
          - name: pathInRepo
            value: stepactions/integration-test/process-go-test-results.yaml
      params:
        - name: test_output_file
          value: $(workspaces.source-code.path)/dump/sigstore-e2e-pkcs11/test-result.json
        - name: test_status
          value: $(steps.execute-tas-e2e.results.exit-code)
