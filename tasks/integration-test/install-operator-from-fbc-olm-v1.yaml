apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: install-operator-from-fbc-olm-v1
spec:
  params:
    - name: clusterCredentialsSecretRef
      type: string
      description: Name of the secret containing the cluster admin kubeconfig.
    - name: fbcImage
      type: string
      description: Fbc image to be installed from
    - name: namespace
      type: string
      default: "tas-operator"
      description: Namespace to be used for installation
    - name: operator-name
      type: string
      default: "rhtas-operator"
      description: Name of installed operator
    - name: operator-deployment-name
      type: string
      default: "rhtas-operator"
      description: Name of the controller manager deployment
  volumes:
    - name: credentials
      secret:
        secretName: $(params.clusterCredentialsSecretRef)
  steps:
    - name: run-operator
      image: registry.redhat.io/openshift4/ose-cli-rhel9
      env:
        - name: KUBECONFIG
          value: "/credentials/kubeconfig"
      volumeMounts:
        - name: credentials
          mountPath: /credentials
      script: |
        #!/bin/bash
        set -ex

        if ! oc get namespace "$(params.namespace)" > /dev/null 2>&1; then
          oc new-project "$(params.namespace)"
          echo "Project $(params.namespace) created."
        else
          echo "Project $(params.namespace) already exists."
        fi

        oc create -f - <<EOF
        apiVersion: olm.operatorframework.io/v1
        kind: ClusterCatalog
        metadata:
          labels:
            olm.operatorframework.io/metadata.name: tas-test
            tas: olm-test
          name: tas-test
        spec:
          availabilityMode: Available
          priority: -300
          source:
            image:
              ref: $(params.fbcImage)
            type: Image
        EOF

        sleep 2
        oc wait --for=condition=Serving=true clustercatalog tas-test --timeout=3m

        oc create -f - <<EOF
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: tas-installer
          namespace: $(params.namespace)
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: tas-installer-binding
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
          - kind: ServiceAccount
            name: tas-installer
            namespace: $(params.namespace)
        ---
        apiVersion: olm.operatorframework.io/v1
        kind: ClusterExtension
        metadata:
          name: $(params.operator-deployment-name)
          namespace: $(params.namespace)
        spec:
          namespace: test
          serviceAccount:
            name: tas-installer
          source:
            sourceType: Catalog
            catalog:
              packageName: $(params.operator-name)
              selector:
                matchLabels:
                  tas: olm-test
        EOF

        oc get pods -o yaml
        oc get clustercatalog tas-test -o yaml

        sleep 2
        oc wait --for=condition=Installed=true --timeout=2m clusterextension $(params.operator-deployment-name)
