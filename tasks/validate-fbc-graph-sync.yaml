apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: validate-fbc-graph-sync
spec:
  description: >-
    Verifies the committed FBC catalog is valid and stays in sync with the
    graph template before the image build starts.
  params:
    - name: path-context
      type: string
      description: Path to the FBC content in the source tree.
    - name: ocp-release-version
      type: string
      description: Target OCP version used to select compatible render options.
  stepTemplate:
    securityContext:
      # This Task mixes images that may use different user IDs across steps.
      runAsUser: 0
  workspaces:
    - name: source
      description: Checked-out source tree to validate.
  steps:
    - name: validate-sync
      image: registry.redhat.io/openshift4/ose-operator-registry-rhel9:v4.21
      workingDir: $(workspaces.source.path)
      env:
        - name: PATH_CONTEXT
          value: $(params.path-context)
        - name: OCP_VERSION
          value: $(params.ocp-release-version)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        repo_root=""
        for candidate in "." ./*; do
          if [[ -d "${candidate}" && -f "${candidate}/${PATH_CONTEXT}/graph.yaml" ]]; then
            repo_root="${candidate}"
            break
          fi
        done

        if [[ -z "${repo_root}" ]]; then
          echo "Required graph file ${PATH_CONTEXT}/graph.yaml does not exist under $(pwd)."
          echo "Top-level workspace entries:"
          find . -maxdepth 2 -mindepth 1 | sort | head -50
          exit 1
        fi

        graph_file="${repo_root}/${PATH_CONTEXT}/graph.yaml"

        package="$(
          awk '
            $1 == "name:" {
              value = $2
              gsub(/["'\''"]/, "", value)
              last_name = value
            }
            $1 == "schema:" && $2 == "olm.package" {
              print last_name
              exit
            }
            $1 == "package:" {
              value = $2
              gsub(/["'\''"]/, "", value)
              print value
              exit
            }
          ' "${graph_file}"
        )"

        if [[ -z "${package}" ]]; then
          echo "Failed to resolve package name from ${graph_file}."
          exit 1
        fi

        catalog_dir="${repo_root}/${PATH_CONTEXT}/catalog/${package}"
        catalog_file="${catalog_dir}/catalog.json"

        if [[ ! -d "${catalog_dir}" ]]; then
          echo "Resolved package ${package}, but catalog directory ${catalog_dir} does not exist."
          exit 1
        fi

        if [[ ! -f "${catalog_file}" ]]; then
          echo "Resolved package ${package}, but catalog file ${catalog_file} does not exist."
          exit 1
        fi

        echo "Validating ${PATH_CONTEXT} for package ${package}"

        echo "Running opm validate on committed catalog..."
        opm validate "${catalog_dir}"

        echo "Checking catalog.json is in sync with graph.yaml..."
        graph_norm="$(mktemp)"
        committed_norm="$(mktemp)"
        trap 'rm -f "${graph_norm}" "${committed_norm}"' EXIT

        ruby -ryaml -rjson -e '
          obj = YAML.load_file(ARGV[0])
          entries = obj.fetch("entries").map do |entry|
            if entry["schema"] == "olm.bundle"
              {
                "schema" => entry["schema"],
                "image" => entry["image"],
              }
            else
              entry
            end
          end
          entries = entries.sort_by { |entry| [entry["schema"].to_s, entry["name"].to_s, entry["image"].to_s] }
          puts JSON.generate(entries)
        ' "${graph_file}" | jq -S . > "${graph_norm}"

        jq -Ss '
          map(
            if .schema == "olm.bundle" then
              {
                "schema": .schema,
                "image": .image
              }
            elif .schema == "olm.package" or .schema == "olm.channel" or .schema == "olm.deprecations" then
              .
            else
              empty
            end
          )
          | sort_by(.schema, (.name // ""), (.image // ""))
        ' "${catalog_file}" > "${committed_norm}"

        if ! diff -q "${graph_norm}" "${committed_norm}" >/dev/null 2>&1; then
          echo "catalog.json is out of sync with graph.yaml"
          diff -u "${graph_norm}" "${committed_norm}" | head -50
          exit 1
        fi

        echo "Committed catalog is valid and in sync."
