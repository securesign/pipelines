apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlan
metadata:
  labels:
    release.appstudio.openshift.io/auto-release: 'false'
  name: prepare-release-stream
spec:
  application: rhtas-release
  tenantPipeline:
    serviceAccountName: konflux-bot-0
    pipelineRef:
      resolver: git
      params:
        - name: url
          value: "https://github.com/securesign/pipelines"
        - name: revision
          value: main
        - name: pathInRepo
          value: "pipelines/prepare-release-stream.yaml"
