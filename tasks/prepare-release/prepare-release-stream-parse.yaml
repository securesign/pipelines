apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: prepare-release-stream-parse
spec:
  description: >
    Derive the release branch, name suffix and per-repo component map from a Release and
    Snapshot, for fan-out into prepare-release-components.
  params:
    - name: release
      description: The namespaced name (namespace/name) of the Release
    - name: snapshot
      description: The namespaced name (namespace/name) of the Snapshot
  results:
    - name: branch
    - name: suffix
    - name: release-version
    - name: version
    - name: repos
      type: array
      description: One compact JSON string per repo, {"repo":..., "components":{name:sha, ...}}
  stepTemplate:
    image: quay.io/konflux-ci/release-service-utils:e633d51cd41d73e4b3310face21bb980af7a662f
    env:
      - name: HOME
        value: /workspace
  steps:
    - name: parse
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        data=$(get-resource release "$(params.release)" | jq '.spec.data // {}')
        # spec.data.version is the X.Y.Z version of the project being released (a leading "v" is
        # accepted); the branch, component suffix and operator version are derived from it.
        version=$(jq -r '.version // empty | ltrimstr("v")' <<<"$data")
        [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]
        stream="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
        branch=$(jq -r --arg d "release-$stream" '.branch // $d' <<<"$data")
        suffix=$(jq -r --arg d "-v${stream//./-}" '.nameSuffix // $d' <<<"$data")
        # product version for the central mappings; only differs from version for
        # projects that are versioned independently of the product (e.g. policy-controller-operator)
        release_version=$(jq -r --arg d "$version" '.releaseVersion // $d' <<<"$data")

        get-resource snapshot "$(params.snapshot)" | jq --arg suffix "$suffix" '
          [.spec.components[]
           | {repo: (.source.git.url | sub("^https://github\\.com/"; "") | sub("\\.git$"; "")),
              name: (.name | if ($suffix | length) > 0 and endswith($suffix) then .[:-($suffix | length)] else . end),
              revision: .source.git.revision}]
          | group_by(.repo)
          | map({repo: .[0].repo, components: (map({key: .name, value: .revision}) | from_entries)} | tojson)
        ' > "$(results.repos.path)"

        printf '%s' "$branch" > "$(results.branch.path)"
        printf '%s' "$suffix" > "$(results.suffix.path)"
        printf '%s' "$release_version" > "$(results.release-version.path)"
        printf '%s' "$version" > "$(results.version.path)"
        echo "branch=$branch suffix=$suffix release-version=$release_version version=$version"
        cat "$(results.repos.path)"
