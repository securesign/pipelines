apiVersion: tekton.dev/v1alpha1
kind: StepAction
metadata:
  name: install-tas-pkcs11
spec:
  description: >-
    Deploys a SecureSign CR with PKCS#11/HSM signer configuration for both
    Fulcio and CTLog, then waits for the instance to become Ready.
  image: registry.redhat.io/openshift4/ose-cli
  params:
    - name: credentials
      type: string
      description: Name of the volume with credentials.
    - name: KUBECONFIG
      type: string
      description: KUBECONFIG path.
    - name: tas-namespace
      description: Namespace for PKCS#11 TAS deployment.
      type: string
    - name: OIDC_ISSUER_URL
      description: Trusted artifact signer issuer url
      type: string
    - name: SOFTHSM_IMAGE
      description: SoftHSM init image used for hsm-lib-export init container.
      type: string
      default: "quay.io/securesign/softhsm-init:1.0-test"
  results:
    - name: fulcio-url
    - name: tuf-url
    - name: rekor-url
    - name: rekor-ui-url
    - name: tsa-url
  volumeMounts:
    - name: "$(params.credentials)"
      mountPath: /credentials
  env:
    - name: KUBECONFIG
      value: "/credentials/$(params.KUBECONFIG)"
    - name: NS
      value: "$(params.tas-namespace)"
    - name: OIDC_ISSUER_URL
      value: "$(params.OIDC_ISSUER_URL)"
    - name: SOFTHSM_IMAGE
      value: "$(params.SOFTHSM_IMAGE)"
  script: |
    #!/bin/bash
    set -euo pipefail

    oc apply -n "$NS" -f - <<EOF
    apiVersion: rhtas.redhat.com/v1
    kind: Securesign
    metadata:
      name: securesign-sample
    spec:
      fulcio:
        ingress:
          enabled: true
        config:
          oidcIssuers:
            - clientID: "trusted-artifact-signer"
              issuerURL: "$OIDC_ISSUER_URL"
              issuer: "$OIDC_ISSUER_URL"
              type: "email"
        signer:
          type: pkcs11
          pkcs11:
            keyID: 99
            keyLabel: PKCS11CA
            configRef:
              name: fulcio-pkcs11-config
              key: crypto11.conf
          certificateChain:
            certificateChainRef:
              name: fulcio-root-ca
              key: cert.pem
        auth:
          env:
            - name: SOFTHSM2_CONF
              value: /etc/softhsm/softhsm2.conf
        initContainers:
          - name: hsm-lib-export
            image: $SOFTHSM_IMAGE
            command: ["cp", "/usr/lib64/pkcs11/libsofthsm2.so", "/var/run/hsm-lib/"]
            volumeMounts:
              - name: hsm-lib
                mountPath: /var/run/hsm-lib
        volumes:
          - name: softhsm-config
            configMap:
              name: softhsm-config
          - name: hsm-tokens
            persistentVolumeClaim:
              claimName: hsm-tokens-pvc
        volumeMounts:
          - name: softhsm-config
            mountPath: /etc/softhsm
            readOnly: true
      ctlog:
        signer:
          type: pkcs11
          pkcs11:
            modulePath: /usr/lib64/pkcs11/libsofthsm2.so
            tokenLabel: PKCS11CA
            pinSecretRef:
              name: hsm-credentials
              key: pin
            publicKeyRef:
              name: ctlog-public-key
              key: public.pem
        rootCertificates:
          - name: fulcio-root-ca
            key: cert.pem
        auth:
          env:
            - name: SOFTHSM2_CONF
              value: /etc/softhsm/softhsm2.conf
        initContainers:
          - name: hsm-lib-export
            image: $SOFTHSM_IMAGE
            command: ["cp", "/usr/lib64/pkcs11/libsofthsm2.so", "/var/run/hsm-lib/"]
            volumeMounts:
              - name: hsm-lib
                mountPath: /var/run/hsm-lib
        volumes:
          - name: softhsm-config
            configMap:
              name: softhsm-config
          - name: hsm-tokens
            persistentVolumeClaim:
              claimName: ctlog-hsm-tokens-pvc
        volumeMounts:
          - name: softhsm-config
            mountPath: /etc/softhsm
            readOnly: true
      rekor:
        ingress:
          enabled: true
      tuf:
        ingress:
          enabled: true
      tsa:
        ingress:
          enabled: true
        signer:
          certificateChain:
            intermediateCA:
              - organizationName: Red Hat
            leafCA:
              organizationName: Red Hat
            rootCA:
              organizationName: Red Hat
    EOF

    sleep 1
    echo "Waiting for SecureSign to become Ready..."
    if ! oc wait --for=condition=Ready securesign/securesign-sample --timeout=9m -n "$NS"; then
      echo "ERROR: SecureSign CR not Ready. Dumping debug info:"
      echo "--- SecureSign conditions ---"
      oc get securesign securesign-sample -n "$NS" -o jsonpath='{range .status.conditions[*]}{.type}{"\t"}{.status}{"\t"}{.reason}{"\t"}{.message}{"\n"}{end}' || true
      echo "--- Component conditions ---"
      for comp in fulcio ctlog rekor tuf trillian timestampauthority; do
        echo "=== $comp ==="
        oc get "$comp" -n "$NS" -o jsonpath='{range .items[0].status.conditions[*]}{.type}{"\t"}{.status}{"\t"}{.reason}{"\t"}{.message}{"\n"}{end}' 2>/dev/null || echo "not found"
      done
      echo "--- Pods ---"
      oc get pods -n "$NS" -o wide || true
      echo "--- Events ---"
      oc get events -n "$NS" --sort-by='.lastTimestamp' | tail -30 || true
      exit 1
    fi

    oc get fulcio -o jsonpath='{.items[0].status.url}' -n "$NS" > "$(step.results.fulcio-url.path)"
    oc get tuf -o jsonpath='{.items[0].status.url}' -n "$NS" > "$(step.results.tuf-url.path)"
    oc get rekor -o jsonpath='{.items[0].status.url}' -n "$NS" > "$(step.results.rekor-url.path)"
    oc get rekor -o jsonpath='{.items[0].status.rekorSearchUIUrl}' -n "$NS" > "$(step.results.rekor-ui-url.path)"
    oc get timestampauthority -o jsonpath='{.items[0].status.url}' -n "$NS" > "$(step.results.tsa-url.path)"
