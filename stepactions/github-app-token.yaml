apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: github-app-token
spec:
  description: >-
    Mint a short-lived GitHub App installation token and write it to a file (never to a result or the log).
  image: quay.io/konflux-ci/task-runner:3.3.0@sha256:5bc193136dbe18af00741ad25a70daffc465c4d69a5c4f064be6bd3fecf1fd11
  params:
    - name: secret-name
      type: string
      description: Secret with keys client-id, installation-id and private-key.
    - name: output-path
      type: string
      description: File the installation token is written to (mode 0600).
  env:
    - name: GITHUB_APP_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: $(params.secret-name)
          key: client-id
    - name: GITHUB_APP_INSTALLATION_ID
      valueFrom:
        secretKeyRef:
          name: $(params.secret-name)
          key: installation-id
    - name: GITHUB_APP_PRIVATE_KEY
      valueFrom:
        secretKeyRef:
          name: $(params.secret-name)
          key: private-key
    - name: OUTPUT_PATH
      value: $(params.output-path)
  script: |
    #!/usr/bin/env bash
    set -euo pipefail
    umask 077

    # JWT generation: verbatim from
    # https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-a-json-web-token-jwt-for-a-github-app#example-using-bash-to-generate-a-jwt
    # (only change: client id and private key come from the secret env vars instead of arguments)
    client_id=$GITHUB_APP_CLIENT_ID
    pem=$GITHUB_APP_PRIVATE_KEY

    now=$(date +%s)
    iat=$((${now} - 60)) # Issues 60 seconds in the past
    exp=$((${now} + 600)) # Expires 10 minutes in the future

    b64enc() { openssl base64 | tr -d '=' | tr '/+' '_-' | tr -d '\n'; }

    header_json='{
        "typ":"JWT",
        "alg":"RS256"
    }'
    # Header encode
    header=$( echo -n "${header_json}" | b64enc )

    payload_json="{
        \"iat\":${iat},
        \"exp\":${exp},
        \"iss\":\"${client_id}\"
    }"
    # Payload encode
    payload=$( echo -n "${payload_json}" | b64enc )

    # Signature
    header_payload="${header}"."${payload}"
    signature=$(
        openssl dgst -sha256 -sign <(echo -n "${pem}") \
        <(echo -n "${header_payload}") | b64enc
    )

    # Create JWT
    JWT="${header_payload}"."${signature}"

    resp=$(curl -sS --fail --retry 5 --retry-delay 5 -X POST \
      -H "Accept: application/vnd.github+json" \
      -H "Authorization: Bearer $JWT" \
      -H "X-GitHub-Api-Version: 2026-03-10" \
      "https://api.github.com/app/installations/${GITHUB_APP_INSTALLATION_ID}/access_tokens")
    jq -erj '.token | select(type == "string" and length > 0)' <<<"$resp" > "$OUTPUT_PATH"
