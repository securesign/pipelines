apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  annotations:
    test.appstudio.openshift.io/kind: enterprise-contract
  name: "pipelines-tasks-enterprise-contract"
spec:
  application: pipelines-tasks
  params:
    - name: POLICY_CONFIGURATION
      value: rhtap-releng-tenant/tekton-bundle-standard
    - name: SINGLE_COMPONENT
      value: "true"
  resolverRef:
    params:
      - name: url
        value: https://github.com/conforma/tekton-catalog
      - name: revision
        value: main
      - name: pathInRepo
        value: pipelines/enterprise-contract/0.1/enterprise-contract.yaml
    resolver: git
    resourceKind: pipeline
