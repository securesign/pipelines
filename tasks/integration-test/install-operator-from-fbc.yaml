apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: install-operator-from-fbc
spec:
  params:
    - name: clusterCredentialsSecretRef
      type: string
      description: Name of the secret containing the cluster admin kubeconfig.
    - name: fbcImage
      description: Fbc image to be installed from
    - name: namespace
      default: "openshift-operators"
      description: Namespace to be used for installation
    - name: operator-name
      type: string
      default: "rhtas-operator"
      description: Name of installed operator
    - name: installChannel
      type: string
      default: stable
      description: Operator installation channel (e.g., stable, fast, candidate)
  volumes:
    - name: credentials
      secret:
        secretName: $(params.clusterCredentialsSecretRef)
  steps:
    - name: run-operator
      image: registry.redhat.io/openshift4/ose-cli-rhel9
      env:
        - name: KUBECONFIG
          value: "/credentials/kubeconfig"
      volumeMounts:
        - name: credentials
          mountPath: /credentials
      script: |
        #!/bin/bash
        set -ex

        oc new-project "$(params.namespace)" || true
        
        oc create -f - <<EOF
        apiVersion: operators.coreos.com/v1alpha1
        kind: CatalogSource
        metadata:
          namespace: openshift-marketplace
          name: tas-test
        spec:
          displayName: Operator Catalog
          image:  $(params.fbcImage)
          publisher: grpc
          sourceType: grpc
        EOF
        sleep 2
        oc wait --for=jsonpath='{.status.connectionState.lastObservedState}'=READY catalogsource tas-test -n openshift-marketplace --timeout=3m
        
        oc create -f - <<EOF
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          name: $(params.operator-name)
          namespace: $(params.namespace)
        spec:
          channel: $(params.installChannel)
          installPlanApproval: Automatic
          name: $(params.operator-name)
          source: tas-test
          sourceNamespace: openshift-marketplace
        EOF
        
        oc get pods -n openshift-marketplace -o yaml
        oc get catalogsource tas-test -n openshift-marketplace -o yaml
        
        
        oc get csv -n $(params.namespace) -o yaml

        echo "Waiting for Subscription to report installed CSV..."
        CSV_NAME=""
        until [ -n "$CSV_NAME" ]; do
          CSV_NAME=$(oc get subscription $(params.operator-name) -n $(params.namespace) -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
          if [ -z "$CSV_NAME" ]; then
            echo "Installed CSV not yet available, retrying..."
            oc get csv -n $(params.namespace) || true
            oc get pods -n $(params.namespace) || true
            sleep 5
          fi
        done
        echo "Found installed CSV: $CSV_NAME"

        DEPLOYMENT_NAME=""
        until [ -n "$DEPLOYMENT_NAME" ]; do
          DEPLOYMENT_NAME=$(oc get csv "$CSV_NAME" -n $(params.namespace) -o jsonpath='{.spec.install.spec.deployments[0].name}' 2>/dev/null || true)
          if [ -z "$DEPLOYMENT_NAME" ]; then
            echo "CSV deployment info not yet available, retrying..."
            oc get csv -n $(params.namespace) || true
            sleep 5
          fi
        done
        echo "Discovered deployment name: $DEPLOYMENT_NAME"

        until oc get deployment "$DEPLOYMENT_NAME" -n $(params.namespace) &>/dev/null; do
          echo "Waiting for deployment $DEPLOYMENT_NAME to be created..."
          oc get csv -n $(params.namespace) || true
          oc get pods -n $(params.namespace) || true
          sleep 5
        done
        oc wait --for=condition=available deployment/"$DEPLOYMENT_NAME" --timeout=2m -n $(params.namespace)
