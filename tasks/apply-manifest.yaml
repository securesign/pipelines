apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: apply-manifests
spec:
  workspaces:
    - name: output
  stepTemplate:
    env:
      - name: HOME
        value: /workspace
    image: quay.io/konflux-ci/task-runner:3.1.1@sha256:f0ad156b1f7cb369a8aa9bae5fae3ffc9cc0b8a2ecb5774365188e99237cbf3f
    workingDir: /workspace/output/source
  params:
    - name: manifest
      type: string
      description: Manifest to apply
    - name: release
      type: string
      default: "false"
      description: whether or not to apply the manifest
  steps:
    - name: apply-manifest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "Applying: $(params.manifest)"
        cat "$(params.manifest)"
        echo ""

        if [ "$(params.release)" == "true" ]; then
          oc apply -f "$(params.manifest)"
        else
          echo "Performing DRY RUN"
          oc apply --dry-run=server -f "$(params.manifest)"
        fi
