---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: operator-upgrade-
spec:
  workspaces:
    - name: work
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  pipelineSpec:
    params:
      - name: SNAPSHOT
      - name: OCP_VERSION
        default: "4.19"
      - name: COMPUTE_NODE_TYPE
        default: m5.large
        description: Instance type for HyperShift compute nodes.
      - name: HOSTED_MANAGEMENT_CLUSTER
        default: hosted-mgmt2
        description: Hosted management cluster used to provision the ephemeral cluster.
      - name: TAS_DEPLOY_NAMESPACE
        default: "tas-e2e"
    workspaces:
      - name: work
    tasks:
      - name: parse-metadata
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/konflux-ci/tekton-integration-catalog
            - name: revision
              value: main
            - name: pathInRepo
              value: tasks/test-metadata/0.4/test-metadata.yaml
        params:
          - name: SNAPSHOT
            value: $(params.SNAPSHOT)
      - name: release-info
        runAfter:
          - parse-metadata
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/securesign/pipelines.git
            - name: revision
              value: main
            - name: pathInRepo
              value: tasks/integration-test/derive-release-info.yaml
        params:
          - name: package-name
            value: "rhtas-operator"
          - name: fbc-image
            value: "$(tasks.parse-metadata.results.container-image)"
          - name: ocp-version
            value: $(params.OCP_VERSION)
      - name: clone-operator-source-code
        runAfter:
          - release-info
        taskRef:
          params:
            - name: name
              value: git-clone
            - name: bundle
              value: quay.io/konflux-ci/tekton-catalog/task-git-clone:0.2.6
            - name: kind
              value: task
          resolver: bundles
        params:
          - name: url
            value: "https://github.com/securesign/secure-sign-operator.git"
          - name: revision
            value: "$(tasks.release-info.results.release-branch)"
          - name: subdirectory
            value: "operator"
        workspaces:
          - name: output
            workspace: work
      - name: prepare-cluster-env
        taskSpec:
          workspaces:
            - name: env-files
          steps:
            - name: write-image-content-sources
              image: registry.redhat.io/ubi9/ubi-minimal:latest
              script: |
                #!/usr/bin/env sh
                mkdir -p "$(workspaces.env-files.path)/cluster-env"
                cat > "$(workspaces.env-files.path)/cluster-env/IMAGE_CONTENT_SOURCES" <<'EOF'
                - source: registry.redhat.io/rhtas/rhtas-operator-bundle
                  mirrors:
                    - quay.io/securesign/rhtas-operator-bundle
                    - quay.io/securesign/rhtas-operator-bundle-v1-0
                    - quay.io/securesign/rhtas-operator-bundle-v1-1
                    - quay.io/securesign/rhtas-operator-bundle-v1-2
                    - quay.io/securesign/rhtas-operator-bundle-v1-3
                - source: registry.redhat.io/rhtas/rhtas-rhel9-operator
                  mirrors:
                    - quay.io/securesign/rhtas-operator
                    - quay.io/securesign/rhtas-operator-v1-0
                    - quay.io/securesign/rhtas-operator-v1-1
                    - quay.io/securesign/rhtas-operator-v1-2
                    - quay.io/securesign/rhtas-operator-v1-3
                - source: registry.redhat.io/rhtas/trillian-logsigner-rhel9
                  mirrors:
                  - quay.io/securesign/trillian-logsigner
                - source: registry.redhat.io/rhtas/trillian-logserver-rhel9
                  mirrors:
                  - quay.io/securesign/trillian-logserver
                - source: registry.redhat.io/rhtas/trillian-database-rhel9
                  mirrors:
                  - quay.io/securesign/trillian-database
                - source: registry.redhat.io/rhtas/fulcio-rhel9
                  mirrors:
                  - quay.io/securesign/fulcio-server
                - source: registry.redhat.io/rhtas/trillian-redis-rhel9
                  mirrors:
                  - quay.io/securesign/trillian-redis
                - source: registry.redhat.io/rhtas/rekor-server-rhel9
                  mirrors:
                  - quay.io/securesign/rekor-server
                - source: registry.redhat.io/rhtas/rekor-search-ui-rhel9
                  mirrors:
                  - quay.io/securesign/rekor-search-ui
                - source: registry.redhat.io/rhtas/rekor-backfill-redis-rhel9
                  mirrors:
                  - quay.io/securesign/rekor-backfill-redis
                - source: registry.redhat.io/rhtas/rekor-monitor-rhel9
                  mirrors:
                  - quay.io/securesign/rekor-monitor
                - source: registry.redhat.io/rhtas/ctlog-monitor-rhel9
                  mirrors:
                  - quay.io/securesign/ctlog-monitor
                - source: registry.redhat.io/rhtas/tuf-server-rhel9
                  mirrors:
                  - quay.io/securesign/scaffold-tuf-server
                - source: registry.redhat.io/rhtas/certificate-transparency-rhel9
                  mirrors:
                  - quay.io/securesign/certificate-transparency-go
                - source: registry.redhat.io/rhtas/client-server-cg-rhel9
                  mirrors:
                  - quay.io/securesign/cli-client-server-cg
                - source: registry.redhat.io/rhtas/client-server-re-rhel9
                  mirrors:
                  - quay.io/securesign/client-server-re
                - source: registry.redhat.io/rhtas/segment-reporting-rhel9
                  mirrors:
                  - quay.io/securesign/segment-backup-job
                - source: registry.redhat.io/rhtas/timestamp-authority-rhel9
                  mirrors:
                  - quay.io/securesign/timestamp-authority
                - source: registry.redhat.io/rhtas/createtree-rhel9
                  mirrors:
                  - quay.io/securesign/trillian-createtree
                - source: registry.redhat.io/rhtas/client-server-rhel9
                  mirrors:
                  - quay.io/securesign/client-server
                - source: registry.redhat.io/rhtas/tuffer-rhel9
                  mirrors:
                  - quay.io/securesign/tuffer
                - source: registry.redhat.io/rhtas/rhtas-console-ui-rhel9
                  mirrors:
                  - quay.io/securesign/rhtas-console-ui
                - source: registry.redhat.io/rhtas/rhtas-console-rhel9
                  mirrors:
                  - quay.io/securesign/rhtas-console
                - source: registry.redhat.io/rhtas/tufcli-init-rhel9
                  mirrors:
                  - quay.io/securesign/tufcli-init
                EOF
        workspaces:
          - name: env-files
            workspace: work
      - name: provision-cluster
        runAfter:
          - prepare-cluster-env
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/openshift/konflux-tasks
            - name: revision
              value: main
            - name: pathInRepo
              value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
        workspaces:
          - name: env-files
            workspace: work
            subPath: cluster-env
        params:
          - name: ownerName
            value: $(context.pipelineRun.name)
          - name: ownerUid
            value: $(context.pipelineRun.uid)
          - name: workflow
            value: hypershift-hostedcluster-workflow
          - name: clusterProfile
            value: aws-konflux-prod
          - name: timeout
            value: 1h
          - name: env
            value: '{"COMPUTE_NODE_TYPE":"$(params.COMPUTE_NODE_TYPE)","HOSTED_MANAGEMENT_CLUSTER":"$(params.HOSTED_MANAGEMENT_CLUSTER)"}'
          - name: releases
            value: >-
              {"latest":{"release":{"channel":"stable","version":"$(params.OCP_VERSION)","architecture":"multi"}}}

      - name: download-binaries
        workspaces:
          - name: work
            workspace: work
        taskSpec:
          workspaces:
            - name: work
          steps:
            - name: get-cosign
              image: registry.redhat.io/rhtas/cosign-rhel9:1.3.1
              securityContext:
                runAsUser: 0
              script: |
                mkdir -p $(workspaces.work.path)/binaries
                cp /usr/local/bin/cosign $(workspaces.work.path)/binaries/
      - name: prepare-tests
        runAfter:
          - provision-cluster
          - clone-operator-source-code
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/securesign/pipelines.git
            - name: revision
              value: main
            - name: pathInRepo
              value: tasks/integration-test/prepare-tests.yaml
        params:
          - name: clusterCredentialsSecretRef
            value: $(tasks.provision-cluster.results.secretRef)
          - name: workdir
            value: "operator"
        workspaces:
          - name: source-code
            workspace: work
      - name: run-operator-upgrade
        runAfter:
          - prepare-tests
          - download-binaries
        workspaces:
          - name: source-code
            workspace: work
        params:
          - name: clusterCredentialsSecretRef
            value: $(tasks.provision-cluster.results.secretRef)
        taskSpec:
          params:
            - name: clusterCredentialsSecretRef
              type: string
          results:
            - name: TEST_OUTPUT
              description: "Full JSON summary of test results"
          volumes:
            - name: credentials
              secret:
                secretName: $(params.clusterCredentialsSecretRef)
            - name: push-creds
              secret:
                secretName: securesign-test-dump-oci
            - name: quay-creds
              secret:
                secretName: quay-e2e-test-creds
                items:
                  - key: .dockerconfigjson
                    path: config.json
          workspaces:
            - name: source-code
          steps:
            - name: execute-test
              onError: continue
              image: registry.redhat.io/ubi9/go-toolset@sha256:685ccca486cc2c82b0818d835abecb1aed7a396e76ba416cfc47c28067f5d365
              results:
                - name: exit-code
              env:
                - name: OIDC_HOST
                  value: "$(tasks.prepare-tests.results.oidc-hostname)"
                - name: KUBECONFIG
                  value: "/credentials/kubeconfig"
                - name: CI
                  value: "true"
                - name: TEST_BASE_CATALOG
                  value: "registry.redhat.io/redhat/redhat-operator-index:v$(params.OCP_VERSION)"
                - name: TEST_TARGET_CATALOG
                  value: "$(tasks.parse-metadata.results.container-image)"
                - name: TEST_UPGRADE_CHANNEL
                  value: "$(tasks.release-info.results.channel)"
                - name: DOCKER_CONFIG
                  value: /quay-auth
              volumeMounts:
                - name: credentials
                  mountPath: /credentials
                - name: push-creds
                  mountPath: /push-creds
                - name: quay-creds
                  mountPath: /quay-auth
              workingDir: $(workspaces.source-code.path)/operator
              script: |
                #!/bin/sh
                set +e -o pipefail
      
                mkdir -p $(workspaces.source-code.path)/dump/operator-upgrade/
      
                export PATH="$PATH:$(workspaces.source-code.path)/binaries"
                export OIDC_ISSUER_URL=https://$OIDC_HOST/realms/trusted-artifact-signer
                openssl s_client -connect $OIDC_HOST:443 > /tmp/ssl.cert
                export SSL_CERT_FILE=/tmp/ssl.cert
                go mod vendor
                make generate
                go test -p 1 ./test/e2e/... -tags=upgrade -timeout 20m -json > $(workspaces.source-code.path)/dump/operator-upgrade/test-result.json
                status=$?
                printf "%s" "$status" > "$(step.results.exit-code.path)"
      
                cp test/**/k8s-dump-*.tar.gz $(workspaces.source-code.path)/dump/operator-upgrade/ || echo "no test dump files found"

              securityContext:
                runAsUser: 0
            - name: process-test-results
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/securesign/pipelines.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/integration-test/process-go-test-results.yaml
              params:
                - name: test_output_file
                  value: $(workspaces.source-code.path)/dump/operator-upgrade/test-result.json
                - name: test_status
                  value: $(steps.execute-test.results.exit-code)
    finally:
      - name: secure-push-test-dump
        workspaces:
          - name: dump
            workspace: work
        taskSpec:
          workspaces:
            - name: dump
          volumes:
            - name: push-creds
              secret:
                secretName: securesign-test-dump-oci
          steps:
            - name: oci-push
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/konflux-ci/tekton-integration-catalog.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/secure-push-oci/0.1/secure-push-oci.yaml
              params:
                - name: oci-ref
                  value: "quay.io/securesign/test-dump-oci:$(context.pipelineRun.name)"
                - name: credentials-volume-name
                  value: push-creds
                - name: oci-tag-expiration
                  value: 1d
                - name: workdir-path
                  value: $(workspaces.dump.path)/dump
