- op: add
  path: /spec/resources/-
  value:
    apiVersion: appstudio.redhat.com/v1beta2
    kind: IntegrationTestScenario
    metadata:
      labels:
        test.appstudio.openshift.io/optional: "false"
      name: "policy-controller-operator-e2e{{.nameSuffix}}"
    spec:
      application: "{{.application}}{{.nameSuffix}}"
      contexts:
        - description: runs the integration test for a group Snapshot
          name: group
      resolverRef:
        params:
        - name: url
          value: https://github.com/securesign/pipelines.git
        - name: revision
          value: main
        - name: pathInRepo
          value: pipelines/integration-test/policy-controller-operator-e2e.yaml
        resolver: git
        resourceKind: pipelinerun

- op: add
  path: /spec/resources/-
  value:
    apiVersion: appstudio.redhat.com/v1beta2
    kind: IntegrationTestScenario
    metadata:
      labels:
        test.appstudio.openshift.io/optional: "false"
      name: "policy-controller-operator-e2e{{.nameSuffix}}-fips"
    spec:
      application: "{{.application}}{{.nameSuffix}}"
      contexts:
        - description: runs the integration test for a group Snapshot
          name: group
      params:
        - name: FIPS_ENABLED
          value: "true"
        - name: CLUSTER_PLATFORM
          value: "openshift"
      resolverRef:
        params:
        - name: url
          value: https://github.com/securesign/pipelines.git
        - name: revision
          value: main
        - name: pathInRepo
          value: pipelines/integration-test/policy-controller-operator-e2e.yaml
        resolver: git
        resourceKind: pipelinerun
